px; font-weight:700; letter-spacing:-.018em;\">Wie wirksam wird Führung im Alltag erlebt?<\u002Fh3>\n        <p style=\"margin-top:12px; font-size:16px; color:#3C4A5A;\">Eine Führungskraft schätzt ihre Coachingkompetenz hoch ein. Wie sieht die Aussensicht aus und was könnte eine On-the-Job-Begleitung zusätzlich zeigen?<\u002Fp>\n        <div style=\"margin-top:auto; padding-top:22px; border-top:1px solid #D9DFE6;\">\n          <div style=\"font-size:11.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#AA1351;\">Was eine Führungskraft daraus ableiten könnte<\u002Fdiv>\n          <p style=\"margin-top:9px; font-size:15.5px; color:#3C4A5A;\">Eine Differenz im Eigen- und Fremdbild kann Anlass für einen Führungsdialog sein. Ergänzende Beobachtungen helfen, gezielte Entwicklungsschritte zu bestimmen.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF; border:1px solid #D9DFE6; padding:24px 24px 26px;\">\n        <div style=\"display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-start; justify-content:space-between;\">\n          <div><h3 style=\"font-size:19px; font-weight:700;\">Eigen- und Fremdsicht · Teamleitung<\u002Fh3><p style=\"margin-top:6px; font-size:14px; color:#5F6E80;\">Eigenständige Beispielrolle · Skala 1 bis 10 · Differenz in Plum<\u002Fp><\u002Fdiv>\n          <span style=\"display:inline-flex; align-items:center; gap:8px; border:1px solid #AA1351; color:#AA1351; padding:5px 12px; font-size:12px; font-weight:700; white-space:nowrap;\"><i style=\"width:7px; height:7px; background:#AA1351; display:block;\"><\u002Fi>Musterdaten<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px; display:grid; gap:20px;\">\n          <sc-for list=\"{{ paare }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px;\">\n                <span style=\"font-size:15px; font-weight:700;\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-size:13px; font-weight:700; color:{{ p.deltaFarbe }}; font-variant-numeric:tabular-nums;\">Δ {{ p.delta }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:10px; position:relative; height:26px;\">\n                <i style=\"position:absolute; left:0; right:0; top:12px; height:2px; background:#ECEFF3; display:block;\"><\u002Fi>\n                <i style=\"position:absolute; top:12px; height:2px; left:{{ p.links }}; width:{{ p.breite }}; background:{{ p.deltaFarbe }}; display:block; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi>\n                <i style=\"position:absolute; top:5px; left:{{ p.fPos }}; width:16px; height:16px; margin-left:-8px; background:#FFFFFF; border:3px solid #5F6E80; border-radius:50%; display:block; animation:dehnen .5s ease-out both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi>\n                <i style=\"position:absolute; top:5px; left:{{ p.ePos }}; width:16px; height:16px; margin-left:-8px; background:#486EA3; border:3px solid #486EA3; border-radius:50%; display:block; animation:dehnen .5s ease-out both; animation-delay:.2s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi>\n              <\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:#5F6E80; font-variant-numeric:tabular-nums;\"><span>Fremdsicht {{ p.f }}<\u002Fspan><span>Eigensicht {{ p.e }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; padding-top:14px; border-top:1px solid #ECEFF3; display:flex; flex-wrap:wrap; gap:9px 20px; align-items:center; font-size:12.5px; color:#5F6E80;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px;\"><i style=\"width:13px; height:13px; background:#486EA3; border-radius:50%; display:block;\"><\u002Fi>Eigensicht<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:8px;\"><i style=\"width:13px; height:13px; background:#FFFFFF; border:3px solid #5F6E80; border-radius:50%; display:block;\"><\u002Fi>Fremdsicht<\u002Fspan>\n          <span>Abweichungen sind Hinweise für den Dialog, kein Urteil über eine Person.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:34px; border-top:1px solid #D9DFE6;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleErk }}\" style=\"width:100%; background:transparent; border:0; font:inherit; cursor:pointer; padding-block:19px; display:flex; align-items:center; gap:13px; font-size:16.5px; font-weight:700; color:#486EA3; text-align:left;\">\n        <span style=\"display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:1px solid currentColor; font-size:16px; font-weight:700; flex:none;\">{{ erkZeichen }}<\u002Fspan>Welche weiteren Erkenntnisse die Standortbestimmung liefern kann\n      <\u002Fbutton>\n      <div style=\"display:{{ erkAnzeige }}; padding-bottom:12px; gap:1px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); background:#ECEFF3; border:1px solid #ECEFF3;\">\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Stärken und Entwicklungsfelder<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Welche Kompetenzen sind stark ausgeprägt und wo gibt es Hinweise auf Entwicklungsbedarf?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Unterschiede innerhalb von Teams<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Wo ist eine gemeinsame Massnahme sinnvoll, wo eher individuelle Begleitung?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Eigen- und Fremdbild<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Welche Wahrnehmungen stimmen überein und wo lohnt sich ein genauerer Blick?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Team- oder Standortvergleich<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Welche Unterschiede sind in ausreichend grossen Gruppen erkennbar?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Qualitative Muster<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Welche Rahmenbedingungen unterstützen oder erschweren die tägliche Arbeit?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:20px;\"><h4 style=\"font-size:16px; font-weight:700;\">Belastbarkeit der Ergebnisse<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Welche Aussagen werden durch die Daten getragen und wo bestehen Grenzen?<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 3 · METHODENFLUSS ============ -->\n<section id=\"methodik\" style=\"padding:84px 24px;\">\n  <div data-wrap=\"1\" style=\"max-width:1240px; margin-inline:auto;\">\n    <div style=\"max-width:800px; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 55%;\">\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <span style=\"font-size:12px; font-weight:800; letter-spacing:.15em; color:#AA1351;\">04<\u002Fspan>\n        <span style=\"height:1px; width:46px; background:#AA1351; opacity:.5; display:block;\"><\u002Fspan>\n        <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#5F6E80;\">Unsere Erhebung<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin-top:16px; font-size:clamp(27px,3.4vw,40px); font-weight:700; line-height:1.07; letter-spacing:-.028em; text-wrap:balance;\">Fünf Methoden. Ein differenzierter Blick auf den Ist-Zustand.<\u002Fh2>\n      <p style=\"margin-top:16px; font-size:17.5px; color:#5F6E80; max-width:66ch;\">Wir kombinieren digitale und persönliche Erhebungen mit Beobachtungen im Arbeitsalltag. Jede Methode liefert eine eigene Perspektive.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-rsp=\"methodik\" style=\"margin-top:40px; display:grid; grid-template-columns:minmax(0,1.4fr) clamp(0px,7vw,140px) minmax(0,1fr); align-items:stretch;\">\n      <div style=\"display:grid; grid-auto-rows:auto; gap:1px; background:#E3E9EF; border:1px solid #E3E9EF;\">\n        <div style=\"background:#FFFFFF; padding:18px 22px 18px 24px; border-left:3px solid #1D3149; transition:background .2s ease-out, transform .25s ease-out; animation:auf .7s cubic-bezier(.22,.72,.26,1) both; animation-delay:0.00s; animation-timeline:view(); animation-range:entry 0% cover 28%;\" style-hover=\"background:#F5F8FB;\">\n          <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-size:11.5px; font-weight:800; letter-spacing:.1em; color:#1D3149;\">01<\u002Fspan><h3 style=\"font-size:18px; font-weight:700;\">Skill-Check<\u002Fh3><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid #486EA3; color:#486EA3; padding:2px 8px; white-space:nowrap;\">misst<\u002Fspan><\u002Fdiv>\n          <p style=\"margin-top:8px; font-size:14.5px; color:#5F6E80;\">Ein digitaler Check, den wir gezielt auf die Anforderungen der untersuchten Rolle zuschneiden. Kein Standard-Fragenkatalog.<\u002Fp>\n          <p style=\"margin-top:9px; font-size:13.5px; color:#3C4A5A; font-style:italic;\">Der Skill-Check liefert eine eigenständige Erhebung und ist nicht mit der Eigensicht gleichzusetzen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:18px 22px 18px 24px; border-left:3px solid #486EA3; transition:background .2s ease-out, transform .25s ease-out; animation:auf .7s cubic-bezier(.22,.72,.26,1) both; animation-delay:0.09s; animation-timeline:view(); animation-range:entry 0% cover 28%;\" style-hover=\"background:#F5F8FB;\">\n          <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-size:11.5px; font-weight:800; letter-spacing:.1em; color:#486EA3;\">02<\u002Fspan><h3 style=\"font-size:18px; font-weight:700;\">Eigensicht<\u002Fh3><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid #486EA3; color:#486EA3; padding:2px 8px; white-space:nowrap;\">misst<\u002Fspan><\u002Fdiv>\n          <p style=\"margin-top:8px; font-size:14.5px; color:#5F6E80;\">Wie schätzen Mitarbeitende oder Führungskräfte ihre eigenen Kompetenzen und Verhaltensweisen ein? Die Selbsteinschätzung macht die persönliche Wahrnehmung sichtbar.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:18px 22px 18px 24px; border-left:3px solid #6D93C0; transition:background .2s ease-out, transform .25s ease-out; animation:auf .7s cubic-bezier(.22,.72,.26,1) both; animation-delay:0.18s; animation-timeline:view(); animation-range:entry 0% cover 28%;\" style-hover=\"background:#F5F8FB;\">\n          <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-size:11.5px; font-weight:800; letter-spacing:.1em; color:#6D93C0;\">03<\u002Fspan><h3 style=\"font-size:18px; font-weight:700;\">Fremdsicht<\u002Fh3><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid #486EA3; color:#486EA3; padding:2px 8px; white-space:nowrap;\">misst<\u002Fspan><\u002Fdiv>\n          <p style=\"margin-top:8px; font-size:14.5px; color:#5F6E80;\">Wie beurteilen andere, beispielsweise vorgesetzte Führungskräfte, dieselben Kompetenzen und Verhaltensweisen? Im Vergleich mit der Eigensicht werden Übereinstimmungen und Unterschiede erkennbar.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:18px 22px 18px 24px; border-left:3px solid #A0C4DF; transition:background .2s ease-out, transform .25s ease-out; animation:auf .7s cubic-bezier(.22,.72,.26,1) both; animation-delay:0.27s; animation-timeline:view(); animation-range:entry 0% cover 28%;\" style-hover=\"background:#F5F8FB;\">\n          <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-size:11.5px; font-weight:800; letter-spacing:.1em; color:#A0C4DF;\">04<\u002Fspan><h3 style=\"font-size:18px; font-weight:700;\">Interviews<\u002Fh3><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid #9AA7B4; color:#5F6E80; padding:2px 8px; white-space:nowrap;\">ordnet ein<\u002Fspan><\u002Fdiv>\n          <p style=\"margin-top:8px; font-size:14.5px; color:#5F6E80;\">In persönlichen Gesprächen erfahren wir, was die tägliche Arbeit unterstützt, welche Schwierigkeiten auftreten und welche Muster sich wiederholen.<\u002Fp>\n          <p style=\"margin-top:9px; font-size:13.5px; color:#3C4A5A; font-style:italic;\">Die Erkenntnisse dienen der qualitativen Einordnung. Sie sind keine zusätzlichen Testergebnisse.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; padding:18px 22px 18px 24px; border-left:3px solid #AA1351; transition:background .2s ease-out, transform .25s ease-out; animation:auf .7s cubic-bezier(.22,.72,.26,1) both; animation-delay:0.36s; animation-timeline:view(); animation-range:entry 0% cover 28%;\" style-hover=\"background:#F5F8FB;\">\n          <div style=\"display:flex; align-items:baseline; gap:12px;\"><span style=\"font-size:11.5px; font-weight:800; letter-spacing:.1em; color:#AA1351;\">05<\u002Fspan><h3 style=\"font-size:18px; font-weight:700;\">On-the-Job-Begleitung<\u002Fh3><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid #486EA3; color:#486EA3; padding:2px 8px; white-space:nowrap;\">misst<\u002Fspan><\u002Fdiv>\n          <p style=\"margin-top:8px; font-size:14.5px; color:#5F6E80;\">Wir begleiten ausgewählte Mitarbeitende und Führungskräfte in ihrer täglichen Arbeit. Anhand definierter Kriterien beobachten wir, wie Kompetenzen in realen Situationen eingesetzt werden.<\u002Fp>\n          <div style=\"margin-top:12px; display:flex; flex-wrap:wrap; gap:7px;\">\n            <span style=\"border:1px solid #D9DFE6; padding:4px 11px; font-size:13px; color:#3C4A5A;\">Kundengespräche<\u002Fspan>\n            <span style=\"border:1px solid #D9DFE6; padding:4px 11px; font-size:13px; color:#3C4A5A;\">Führungsgespräche<\u002Fspan>\n            <span style=\"border:1px solid #D9DFE6; padding:4px 11px; font-size:13px; color:#3C4A5A;\">Teammeetings<\u002Fspan>\n            <span style=\"border:1px solid #D9DFE6; padding:4px 11px; font-size:13px; color:#3C4A5A;\">Zusammenarbeit<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin-top:10px; font-size:13.5px; color:#3C4A5A; font-style:italic;\">Fester Bestandteil unserer Standortbestimmung. Welche Arbeitssituationen wir begleiten und in welchem Umfang, stimmen wir auf Deine Fragestellung ab.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-rsp=\"fluss\" style=\"position:relative;\" aria-hidden=\"true\">\n        <svg sc-camel-view-box=\"0 0 140 500\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute; inset:0; width:100%; height:100%;\">\n          <path d=\"M0 50 C 66 50, 74 250, 132 250\" fill=\"none\" stroke=\"#486EA3\" stroke-width=\"1.6\" vector-effect=\"non-scaling-stroke\" style=\"--len:420; stroke-dasharray:420; animation:zeichnen 1.1s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 35%;\"><\u002Fpath>\n          <path d=\"M0 150 C 66 150, 74 250, 132 250\" fill=\"none\" stroke=\"#486EA3\" stroke-width=\"1.6\" vector-effect=\"non-scaling-stroke\" style=\"--len:360; stroke-dasharray:360; animation:zeichnen 1.1s cubic-bezier(.22,.72,.26,1) both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% cover 35%;\"><\u002Fpath>\n          <path d=\"M0 250 L 132 250\" fill=\"none\" stroke=\"#486EA3\" stroke-width=\"1.6\" vector-effect=\"non-scaling-stroke\" style=\"--len:330; stroke-dasharray:330; animation:zeichnen 1.1s cubic-bezier(.22,.72,.26,1) both; animation-delay:.2s; animation-timeline:view(); animation-range:entry 0% cover 35%;\"><\u002Fpath>\n          <path d=\"M0 350 C 66 350, 74 250, 132 250\" fill=\"none\" stroke=\"#9AA7B4\" stroke-width=\"1.6\" stroke-dasharray=\"5 5\" vector-effect=\"non-scaling-stroke\" style=\"opacity:0; animation:aufZart .8s ease-out both; animation-delay:.3s; animation-timeline:view(); animation-range:entry 0% cover 35%;\"><\u002Fpath>\n          <path d=\"M0 450 C 66 450, 74 250, 132 250\" fill=\"none\" stroke=\"#486EA3\" stroke-width=\"1.6\" vector-effect=\"non-scaling-stroke\" style=\"--len:420; stroke-dasharray:420; animation:zeichnen 1.1s cubic-bezier(.22,.72,.26,1) both; animation-delay:.4s; animation-timeline:view(); animation-range:entry 0% cover 35%;\"><\u002Fpath>\n          <circle r=\"3.4\" fill=\"#486EA3\"><animateMotion dur=\"3.2s\" begin=\"0.00s\" sc-camel-repeat-count=\"indefinite\" sc-camel-key-points=\"0;1\" sc-camel-key-times=\"0;1\" sc-camel-calc-mode=\"linear\" path=\"M0 50 C 66 50, 74 250, 132 250\"><\u002FanimateMotion><\u002Fcircle>\n          <circle r=\"3.4\" fill=\"#486EA3\"><animateMotion dur=\"3.2s\" begin=\"0.45s\" sc-camel-repeat-count=\"indefinite\" sc-camel-key-points=\"0;1\" sc-camel-key-times=\"0;1\" sc-camel-calc-mode=\"linear\" path=\"M0 150 C 66 150, 74 250, 132 250\"><\u002FanimateMotion><\u002Fcircle>\n          <circle r=\"3.4\" fill=\"#486EA3\"><animateMotion dur=\"3.2s\" begin=\"0.90s\" sc-camel-repeat-count=\"indefinite\" sc-camel-key-points=\"0;1\" sc-camel-key-times=\"0;1\" sc-camel-calc-mode=\"linear\" path=\"M0 250 L 132 250\"><\u002FanimateMotion><\u002Fcircle>\n          <circle r=\"3.4\" fill=\"#9AA7B4\"><animateMotion dur=\"3.2s\" begin=\"1.35s\" sc-camel-repeat-count=\"indefinite\" sc-camel-key-points=\"0;1\" sc-camel-key-times=\"0;1\" sc-camel-calc-mode=\"linear\" path=\"M0 350 C 66 350, 74 250, 132 250\"><\u002FanimateMotion><\u002Fcircle>\n          <circle r=\"3.4\" fill=\"#486EA3\"><animateMotion dur=\"3.2s\" begin=\"1.80s\" sc-camel-repeat-count=\"indefinite\" sc-camel-key-points=\"0;1\" sc-camel-key-times=\"0;1\" sc-camel-calc-mode=\"linear\" path=\"M0 450 C 66 450, 74 250, 132 250\"><\u002FanimateMotion><\u002Fcircle>\n          <polygon points=\"128,243 140,250 128,257\" fill=\"#486EA3\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div data-rsp=\"ergebnis\" style=\"background:#1D3149; color:#FFFFFF; padding:28px 26px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"font-size:11.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#A0C4DF;\">Ergebnis der Erhebung<\u002Fdiv>\n        <h3 style=\"margin-top:9px; font-size:21px; font-weight:700; color:#FFFFFF;\">Ein differenzierter Ist-Zustand<\u002Fh3>\n        <p style=\"margin-top:10px; font-size:14.5px; color:#C6D9EA;\">Vier Methoden liefern Werte, die Interviews ordnen sie ein.<\u002Fp>\n        <ul style=\"margin:16px 0 0; padding:0; list-style:none; display:grid; gap:7px;\">\n          <li style=\"font-size:14px; color:#DCE8F3; padding-left:18px; position:relative;\"><i style=\"position:absolute; left:0; top:.55em; width:8px; height:8px; background:#A0C4DF; display:block;\"><\u002Fi>Kompetenzwerte je Person und Team<\u002Fli>\n          <li style=\"font-size:14px; color:#DCE8F3; padding-left:18px; position:relative;\"><i style=\"position:absolute; left:0; top:.55em; width:8px; height:8px; background:#A0C4DF; display:block;\"><\u002Fi>Eigen- und Fremdsicht im Vergleich<\u002Fli>\n          <li style=\"font-size:14px; color:#DCE8F3; padding-left:18px; position:relative;\"><i style=\"position:absolute; left:0; top:.55em; width:8px; height:8px; background:#A0C4DF; display:block;\"><\u002Fi>Beobachtetes Verhalten aus dem Alltag<\u002Fli>\n          <li style=\"font-size:14px; color:#DCE8F3; padding-left:18px; position:relative;\"><i style=\"position:absolute; left:0; top:.55em; width:8px; height:8px; background:#A0C4DF; display:block;\"><\u002Fi>Qualitative Hinweise aus den Gesprächen<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:30px; border:1px solid #D9DFE6; background:#FFFFFF; padding:18px 20px; display:grid; grid-template-columns:28px 1fr; gap:14px; align-items:start;\">\n      <span style=\"display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:1px solid #486EA3; color:#486EA3; font-size:13px; font-weight:800;\">i<\u002Fspan>\n      <p style=\"font-size:15px; color:#3C4A5A;\">Die Methoden liefern unterschiedliche Arten von Erkenntnissen. Wir werten sie fachlich nachvollziehbar aus und führen nicht einfach alle Aussagen zu einer einzigen Zahl zusammen.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 4 · UMFANG ============ -->\n<section id=\"umfang\" style=\"background:#1D3149; color:#EAF2F9; padding:84px 24px;\">\n  <div data-wrap=\"1\" style=\"max-width:1240px; margin-inline:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:48px; align-items:start;\">\n    <div style=\"animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 55%;\">\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <span style=\"font-size:12px; font-weight:800; letter-spacing:.15em; color:#A0C4DF;\">05<\u002Fspan>\n        <span style=\"height:1px; width:46px; background:#A0C4DF; opacity:.5; display:block;\"><\u002Fspan>\n        <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#9FB6CC;\">Passend zu Deiner Fragestellung<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin-top:16px; font-size:clamp(26px,3.2vw,38px); font-weight:700; line-height:1.08; letter-spacing:-.028em; color:#FFFFFF;\">So viel Analyse wie sinnvoll.<br>So gezielt wie möglich.<\u002Fh2>\n      <p style=\"margin-top:17px; font-size:17.5px; color:#C6D9EA; max-width:44ch;\">Du bestimmst gemeinsam mit uns, welche Fragen geklärt werden sollen und wo wir genauer hinschauen. Wir definieren einen praktikablen Untersuchungsumfang für Deine Organisation.<\u002Fp>\n      <div style=\"margin-top:26px;\">\n        <div style=\"padding-block:20px; border-top:1px solid rgba(255,255,255,.2); display:grid; grid-template-columns:40px 1fr; gap:16px;\"><span style=\"display:inline-flex; flex-direction:column; gap:7px; font-size:12.5px; font-weight:800; color:#A0C4DF;\">01<i style=\"width:22px; height:3px; display:block; background:#A0C4DF;\"><\u002Fi><\u002Fspan><div><h4 style=\"font-size:17px; font-weight:700; color:#FFFFFF;\">Themen und Ziele<\u002Fh4><p style=\"margin-top:6px; font-size:15px; color:#B8CDE0;\">Beratungsqualität, Führungsqualität oder weitere Performance-Felder.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div style=\"padding-block:20px; border-top:1px solid rgba(255,255,255,.2); display:grid; grid-template-columns:40px 1fr; gap:16px;\"><span style=\"display:inline-flex; flex-direction:column; gap:7px; font-size:12.5px; font-weight:800; color:#6D93C0;\">02<i style=\"width:22px; height:3px; display:block; background:#6D93C0;\"><\u002Fi><\u002Fspan><div><h4 style=\"font-size:17px; font-weight:700; color:#FFFFFF;\">Personen und Einheiten<\u002Fh4><p style=\"margin-top:6px; font-size:15px; color:#B8CDE0;\">Welche Mitarbeitenden, Führungskräfte oder Teams werden einbezogen?<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div style=\"padding-block:20px; border-block:1px solid rgba(255,255,255,.2); display:grid; grid-template-columns:40px 1fr; gap:16px;\"><span style=\"display:inline-flex; flex-direction:column; gap:7px; font-size:12.5px; font-weight:800; color:#AA1351;\">03<i style=\"width:22px; height:3px; display:block; background:#AA1351;\"><\u002Fi><\u002Fspan><div><h4 style=\"font-size:17px; font-weight:700; color:#FFFFFF;\">Erhebungstiefe<\u002Fh4><p style=\"margin-top:6px; font-size:15px; color:#B8CDE0;\">Wie viele Skill-Checks, Sichtweisen, Interviews und On-the-Job-Begleitungen sind sinnvoll?<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Umfangs-Cockpit -->\n    <div style=\"border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.05); padding:0 0 28px; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.12s; animation-timeline:view(); animation-range:entry 0% entry 50%;\">\n      <i style=\"display:block; height:4px; background:linear-gradient(90deg,#1D3149,#486EA3,#A0C4DF,#AA1351); transform-origin:left center; animation:wachsen .9s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi>\n      <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:26px 26px 0;\">\n        <div>\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#9FB6CC;\">Umfang skizzieren<\u002Fdiv>\n          <h3 style=\"margin-top:7px; font-size:19px; font-weight:700; color:#FFFFFF;\">Wie könnte Dein Rahmen aussehen?<\u002Fh3>\n        <\u002Fdiv>\n        <span style=\"border:1px solid rgba(255,255,255,.3); color:#A0C4DF; padding:4px 10px; font-size:11px; font-weight:700; white-space:nowrap;\">Unverbindlich<\u002Fspan>\n      <\u002Fdiv>\n\n      <div sc-camel-on-click=\"{{ waehleOption }}\" style=\"margin:22px 26px 0; display:grid; gap:18px;\">\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#9FB6CC;\">Themen und Ziele<\u002Fdiv>\n          <div data-k=\"t\" style=\"margin-top:9px; display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:6px;\">\n                <button type=\"button\" data-i=\"0\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Ein Fokusthema<\u002Fbutton>\n                <button type=\"button\" data-i=\"1\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Zwei Leistungsfelder<\u002Fbutton>\n                <button type=\"button\" data-i=\"2\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Breite Standortbestimmung<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#9FB6CC;\">Personen und Einheiten<\u002Fdiv>\n          <div data-k=\"p\" style=\"margin-top:9px; display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:6px;\">\n                <button type=\"button\" data-i=\"0\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Ein Team<\u002Fbutton>\n                <button type=\"button\" data-i=\"1\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Mehrere Teams<\u002Fbutton>\n                <button type=\"button\" data-i=\"2\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Ganze Einheit<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#9FB6CC;\">Erhebungstiefe<\u002Fdiv>\n          <div data-k=\"v\" style=\"margin-top:9px; display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:6px;\">\n                <button type=\"button\" data-i=\"0\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Kompakt<\u002Fbutton>\n                <button type=\"button\" data-i=\"1\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Ausgewogen<\u002Fbutton>\n                <button type=\"button\" data-i=\"2\" style=\"font:inherit; font-size:13px; font-weight:600; text-align:left; line-height:1.25; padding:10px 12px; cursor:pointer; overflow-wrap:break-word; hyphens:auto; border:1px solid rgba(255,255,255,.22); background:transparent; color:#B8CDE0; transition:border-color .2s, background .2s, color .2s;\">Vertieft<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin:24px 26px 0; padding-top:20px; border-top:1px solid rgba(255,255,255,.2);\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:14px;\">\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#9FB6CC;\">Daraus entsteht<\u002Fdiv>\n          <b style=\"font-size:19px; color:#FFFFFF;\">{{ umfangLabel }}<\u002Fb>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px; height:10px; background:rgba(255,255,255,.12); position:relative;\">\n          <i data-band=\"1\" style=\"position:absolute; inset-block:0; left:0; display:block; width:45%; background:linear-gradient(90deg,#486EA3,#A0C4DF); transition:width .45s cubic-bezier(.22,.72,.26,1);\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px; display:flex; justify-content:space-between; font-size:11.5px; color:#9FB6CC;\"><span>fokussiert<\u002Fspan><span>umfassend<\u002Fspan><\u002Fdiv>\n        <p style=\"margin-top:16px; font-size:14px; color:#B8CDE0;\">{{ umfangText }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-wrap=\"1\" style=\"max-width:1240px; margin:26px auto 0; font-size:13.5px; color:#9FB6CC;\">Für den Skill-Check gilt: Jede untersuchte Rolle erhält ein passendes Kompetenzprofil und einen darauf entwickelten Online-Skill-Check. Weitere Rollen erfordern entsprechende rollenspezifische Analysen. Die Skizze oben ist eine Orientierung, kein Angebot.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 5 · AUFWAND UND ABLAUF ============ -->\n<section id=\"aufwand\" style=\"padding:84px 24px;\">\n  <div data-wrap=\"1\" style=\"max-width:1240px; margin-inline:auto;\">\n    <div style=\"max-width:800px; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 55%;\">\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <span style=\"font-size:12px; font-weight:800; letter-spacing:.15em; color:#AA1351;\">06<\u002Fspan>\n        <span style=\"height:1px; width:46px; background:#AA1351; opacity:.5; display:block;\"><\u002Fspan>\n        <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#5F6E80;\">Dein Aufwand auf einen Blick<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin-top:16px; font-size:clamp(27px,3.4vw,40px); font-weight:700; line-height:1.07; letter-spacing:-.028em; text-wrap:balance;\">Ein halber Tag am Anfang, ein halber Tag am Ende.<\u002Fh2>\n      <p style=\"margin-top:16px; font-size:17.5px; color:#5F6E80; max-width:66ch;\">Für die verantwortlichen Ansprechpersonen bleibt die Projektsteuerung überschaubar. Dazwischen organisieren wir die Erhebung und führen Interviews sowie On-the-Job-Begleitungen durch.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:36px; display:grid; gap:1px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); background:#ECEFF3; border:1px solid #ECEFF3;\">\n      <div style=\"position:relative; background:#FFFFFF; padding:26px 22px 24px; animation:auf .7s ease-out both; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#1D3149; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"font-size:clamp(26px,3vw,34px); font-weight:700; letter-spacing:-.03em; color:#1D3149; line-height:1;\">0.5 Tage<\u002Fdiv><h4 style=\"margin-top:11px; font-size:16.5px; font-weight:700;\">Gemeinsamer Start<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Fragestellung, Umfang und Vorgehen abstimmen; bei Bedarf die Rollenbasis für den Skill-Check klären.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative; background:#FFFFFF; padding:26px 22px 24px; animation:auf .7s ease-out both; animation-delay:.08s; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#486EA3; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.08s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"font-size:clamp(26px,3vw,34px); font-weight:700; letter-spacing:-.03em; color:#486EA3; line-height:1;\">ca. 25 Min.<\u002Fdiv><h4 style=\"margin-top:11px; font-size:16.5px; font-weight:700;\">Digitaler Skill-Check<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Je teilnehmender Person. Die Eigensicht und Fremdsicht werden separat erhoben und benötigen zusätzliche Zeit.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative; background:#FFFFFF; padding:26px 22px 24px; animation:auf .7s ease-out both; animation-delay:.16s; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#6D93C0; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.16s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"font-size:clamp(26px,3vw,34px); font-weight:700; letter-spacing:-.03em; color:#6D93C0; line-height:1;\">4–6 Wochen<\u002Fdiv><h4 style=\"margin-top:11px; font-size:16.5px; font-weight:700;\">Typische Projektdauer<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Von der Vorbereitung über die Erhebung mit Interviews und On-the-Job-Begleitungen bis zur Auswertung.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative; background:#FFFFFF; padding:26px 22px 24px; animation:auf .7s ease-out both; animation-delay:.24s; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#AA1351; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.24s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"font-size:clamp(26px,3vw,34px); font-weight:700; letter-spacing:-.03em; color:#AA1351; line-height:1;\">0.5 Tage<\u002Fdiv><h4 style=\"margin-top:11px; font-size:16.5px; font-weight:700;\">Ergebnisgespräch<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Wir präsentieren die Erkenntnisse und besprechen konkrete Entwicklungsansätze mit den Entscheidungsträgern.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:50px;\">\n      <span style=\"font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#5F6E80;\">Beispielhafter Ablauf über vier bis sechs Wochen<\u002Fspan>\n      <div style=\"position:relative; margin-top:24px;\">\n        <span style=\"position:absolute; left:0; right:0; top:13px; height:2px; background:#E1E7EE; display:block;\"><\u002Fspan>\n        <span style=\"position:absolute; left:0; right:0; top:13px; height:2px; background:linear-gradient(90deg,#1D3149,#486EA3,#A0C4DF); display:block; transform-origin:left center; animation:wachsen auto linear both; animation-timeline:view(); animation-range:entry 20% cover 70%;\"><\u002Fspan>\n        <div data-rsp=\"ablauf\" style=\"position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px;\">\n          <div style=\"padding-top:42px; position:relative;\"><span style=\"position:absolute; top:5px; left:0; width:17px; height:17px; background:#1D3149; display:block; animation:dehnen .5s ease-out both; animation-timeline:view(); animation-range:entry 25% cover 35%;\"><\u002Fspan><div style=\"font-size:11.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#5F6E80;\">Startphase<\u002Fdiv><h4 style=\"margin-top:7px; font-size:17px; font-weight:700;\">Aufsetzen<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Analyseziele und Erhebung planen<\u002Fp><\u002Fdiv>\n          <div style=\"padding-top:42px; position:relative;\"><span style=\"position:absolute; top:5px; left:0; width:17px; height:17px; background:#486EA3; display:block; animation:dehnen .5s ease-out both; animation-timeline:view(); animation-range:entry 35% cover 45%;\"><\u002Fspan><div style=\"font-size:11.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#5F6E80;\">Erhebungsphase<\u002Fdiv><h4 style=\"margin-top:7px; font-size:17px; font-weight:700;\">Durchführen<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Skill-Check, Eigensicht, Fremdsicht, Interviews und On-the-Job<\u002Fp><\u002Fdiv>\n          <div style=\"padding-top:42px; position:relative;\"><span style=\"position:absolute; top:5px; left:0; width:17px; height:17px; background:#6D93C0; display:block; animation:dehnen .5s ease-out both; animation-timeline:view(); animation-range:entry 45% cover 55%;\"><\u002Fspan><div style=\"font-size:11.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#5F6E80;\">Auswertungsphase<\u002Fdiv><h4 style=\"margin-top:7px; font-size:17px; font-weight:700;\">Einordnen<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Erkenntnisse prüfen und verdichten<\u002Fp><\u002Fdiv>\n          <div style=\"padding-top:42px; position:relative;\"><span style=\"position:absolute; top:5px; left:0; width:17px; height:17px; background:#AA1351; display:block; animation:dehnen .5s ease-out both; animation-timeline:view(); animation-range:entry 55% cover 65%;\"><\u002Fspan><div style=\"font-size:11.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:#5F6E80;\">Abschlussphase<\u002Fdiv><h4 style=\"margin-top:7px; font-size:17px; font-weight:700;\">Besprechen<\u002Fh4><p style=\"margin-top:7px; font-size:14.5px; color:#5F6E80;\">Entwicklungsfelder und Massnahmen priorisieren<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:26px; font-size:14px; color:#5F6E80; max-width:84ch;\">Die Zeitangaben sind Orientierungswerte aus einem typischen Mandat. Für Eigensicht, Fremdsicht und Interviews sowie für die Begleitung der ausgewählten Arbeitssituationen entsteht bei den beteiligten Personen zusätzlicher Aufwand. Umfang und Termine stimmen wir gemeinsam ab. Der tatsächliche Aufwand hängt von der vereinbarten Fragestellung und der Anzahl Teilnehmenden ab.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 7 · NUTZEN UND FOLGEMESSUNG ============ -->\n<section id=\"entwicklung\" style=\"background:#F5F8FB; padding:84px 24px;\">\n  <div data-wrap=\"1\" style=\"max-width:1240px; margin-inline:auto;\">\n    <div style=\"max-width:800px; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 55%;\">\n      <div style=\"display:flex; align-items:center; gap:14px;\">\n        <span style=\"font-size:12px; font-weight:800; letter-spacing:.15em; color:#AA1351;\">07<\u002Fspan>\n        <span style=\"height:1px; width:46px; background:#AA1351; opacity:.5; display:block;\"><\u002Fspan>\n        <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#5F6E80;\">Der konkrete Nutzen<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin-top:16px; font-size:clamp(27px,3.4vw,40px); font-weight:700; line-height:1.07; letter-spacing:-.028em; text-wrap:balance;\">Was bringt Dir die Standortbestimmung?<\u002Fh2>\n      <p style=\"margin-top:16px; font-size:17.5px; color:#5F6E80; max-width:66ch;\">Eine verständliche Grundlage, um Entwicklungsmassnahmen gezielt zu priorisieren und Entscheidungen zu begründen.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:36px; display:grid; gap:1px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); background:#ECEFF3; border:1px solid #ECEFF3;\">\n      <div style=\"position:relative; background:#FFFFFF; padding:30px 26px 28px; animation:auf .7s ease-out both; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#1D3149; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.1em; color:#1D3149;\"><i style=\"width:18px; height:3px; display:block; background:#1D3149;\"><\u002Fi>01<\u002Fdiv><h4 style=\"margin-top:10px; font-size:18px; font-weight:700;\">Ein fundierter Ist-Zustand<\u002Fh4><p style=\"margin-top:8px; font-size:15px; color:#5F6E80;\">mit erkennbaren Stärken, Entwicklungsfeldern und Grenzen der Aussagekraft.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative; background:#FFFFFF; padding:30px 26px 28px; animation:auf .7s ease-out both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#486EA3; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.1em; color:#486EA3;\"><i style=\"width:18px; height:3px; display:block; background:#486EA3;\"><\u002Fi>02<\u002Fdiv><h4 style=\"margin-top:10px; font-size:18px; font-weight:700;\">Konkrete Entwicklungsempfehlungen<\u002Fh4><p style=\"margin-top:8px; font-size:15px; color:#5F6E80;\">für die untersuchten Personen, Rollen oder geeignete Teams.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative; background:#FFFFFF; padding:30px 26px 28px; animation:auf .7s ease-out both; animation-delay:.2s; animation-timeline:view(); animation-range:entry 0% entry 50%;\"><i style=\"position:absolute; left:0; right:0; top:0; height:4px; display:block; background:#AA1351; transform-origin:left center; animation:wachsen .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.2s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><div style=\"display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.1em; color:#AA1351;\"><i style=\"width:18px; height:3px; display:block; background:#AA1351;\"><\u002Fi>03<\u002Fdiv><h4 style=\"margin-top:10px; font-size:18px; font-weight:700;\">Eine Entscheidungspräsentation<\u002Fh4><p style=\"margin-top:8px; font-size:15px; color:#5F6E80;\">als Basis für gezielte Trainings, Coaching, Führungsentwicklung oder weitere Begleitung.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:50px; display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:44px; align-items:center;\">\n      <div style=\"animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 50%;\">\n        <div style=\"display:flex; align-items:center; gap:14px;\">\n          <span style=\"height:1px; width:46px; background:#AA1351; opacity:.5; display:block;\"><\u002Fspan>\n          <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#5F6E80;\">Perspektive · Folgemessung<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin-top:14px; font-size:clamp(22px,2.8vw,30px); font-weight:700; line-height:1.1; letter-spacing:-.02em;\">Was hat sich nach sechs bis zwölf Monaten verändert?<\u002Fh2>\n        <p style=\"margin-top:14px; font-size:16.5px; color:#5F6E80; max-width:48ch;\">Mit einer separat vereinbarten Folgemessung werden Veränderungen der erfassten Kompetenzen sichtbar. So kannst Du weitere Entwicklungsschwerpunkte fundierter beurteilen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #D9DFE6; background:#FFFFFF; padding:26px; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% entry 50%;\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px;\">\n          <span style=\"font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#5F6E80;\">Kompetenzmittel über alle Felder<\u002Fspan>\n          <span style=\"font-size:13px; font-weight:700; color:#AA1351;\">+1.5<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px; display:grid; grid-template-columns:118px minmax(0,1fr) 46px; gap:14px; align-items:center;\">\n          <span style=\"font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5F6E80;\">Ersterhebung T0<\u002Fspan>\n          <span style=\"position:relative; height:26px; background:#E9EFF5; display:block;\"><i style=\"position:absolute; inset-block:0; left:0; width:58%; background:#9AA7B4; display:block; transform-origin:left center; animation:wachsen .9s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><\u002Fspan>\n          <span style=\"text-align:right; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;\">5.8<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px; display:grid; grid-template-columns:118px minmax(0,1fr) 46px; gap:14px; align-items:center;\">\n          <span style=\"font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5F6E80;\">Folgemessung T1<\u002Fspan>\n          <span style=\"position:relative; height:26px; background:#E9EFF5; display:block;\"><i style=\"position:absolute; inset-block:0; left:0; width:73%; background:linear-gradient(90deg,#486EA3,#A0C4DF); display:block; transform-origin:left center; animation:wachsen .9s cubic-bezier(.22,.72,.26,1) both; animation-delay:.25s; animation-timeline:view(); animation-range:entry 0% cover 30%;\"><\u002Fi><\u002Fspan>\n          <span style=\"text-align:right; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;\">7.3<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:18px; padding-top:14px; border-top:1px solid #ECEFF3; font-size:13.5px; color:#5F6E80;\">Illustrative Werte · keine garantierte Entwicklung. Ein Kompetenzvergleich zeigt Veränderungen, beweist für sich allein aber nicht die ursächliche Wirkung einer bestimmten Massnahme.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:50px; border-top:1px solid #D9DFE6; padding-top:22px; display:flex; flex-wrap:wrap; gap:10px 26px; align-items:baseline; justify-content:space-between;\">\n      <b style=\"font-size:17.5px;\">ROWAPA kennt die Praxis der Finanzbranche seit 20 Jahren.<\u002Fb>\n      <span style=\"font-size:14px; color:#5F6E80;\">Beratung · Vertrieb · Mitarbeiterentwicklung · Führung<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 8 · ABSCHLUSS ============ -->\n<section id=\"gespraech\" style=\"background:#1D3149; color:#EAF2F9; padding:84px 24px 60px;\">\n  <div data-wrap=\"1\" style=\"max-width:1240px; margin-inline:auto;\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:50px; align-items:start;\">\n      <div style=\"animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-timeline:view(); animation-range:entry 0% entry 55%;\">\n        <div style=\"display:flex; align-items:center; gap:14px;\">\n          <span style=\"font-size:12px; font-weight:800; letter-spacing:.15em; color:#A0C4DF;\">08<\u002Fspan>\n          <span style=\"height:1px; width:46px; background:#A0C4DF; opacity:.5; display:block;\"><\u002Fspan>\n          <span style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#9FB6CC;\">Der nächste Schritt<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin-top:16px; font-size:clamp(27px,3.4vw,40px); font-weight:700; line-height:1.07; letter-spacing:-.028em; color:#FFFFFF; text-wrap:balance;\">Welche Fragestellung möchtest Du genauer untersuchen?<\u002Fh2>\n        <p style=\"margin-top:17px; font-size:18px; color:#C6D9EA; max-width:46ch;\">Vielleicht gibt es ein Team, eine Rolle oder ein Thema, bei dem Du bereits Entwicklungspotenzial vermutest.<\u002Fp>\n        <p style=\"margin-top:13px; font-size:16px; color:#C6D9EA; max-width:46ch;\">Wir zeigen Dir anhand einer Musterauswertung, wie eine Standortbestimmung für Deine Organisation aussehen kann. Gemeinsam besprechen wir einen sinnvollen Umfang und den möglichen Einstieg.<\u002Fp>\n        <div style=\"margin-top:28px;\">\n          <a href=\"{{ mailLink }}\" style=\"display:inline-flex; align-items:center; gap:12px; background:#AA1351; color:#FFFFFF; padding:21px 36px; font-size:18px; font-weight:700; transition:background .2s ease-out, transform .2s ease-out;\" style-hover=\"background:#8E1044; color:#FFFFFF; transform:translateY(-1px);\"><span aria-hidden=\"true\">→<\u002Fspan>Persönliches Gespräch vereinbaren<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"margin-top:28px; padding-top:18px; border-top:1px solid rgba(255,255,255,.2); font-size:15.5px; color:#A0C4DF; font-weight:600;\">ROWAPA · Seit 20 Jahren spezialisiert auf die Finanzbranche.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:148px minmax(0,1fr); gap:22px; align-items:start; animation:auf .8s cubic-bezier(.22,.72,.26,1) both; animation-delay:.1s; animation-timeline:view(); animation-range:entry 0% entry 50%;\">\n        <div style=\"position:relative; background:rgba(255,255,255,.08); overflow:hidden; aspect-ratio:3 / 4;\">\n          <img src=\"007f691b-0301-4c9d-9571-93b1c0d7723b\" alt=\"Jennifer Boek, Head of Operations\" style=\"display:block; width:100%; height:100%; object-fit:cover; object-position:center 15%;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#9FB6CC; margin-bottom:10px;\">Deine Ansprechperson<\u002Fdiv>\n          <h3 style=\"font-size:21px; font-weight:700; color:#FFFFFF;\">Jennifer Boek<\u002Fh3>\n          <p style=\"margin-top:5px; font-size:14.5px; color:#A0C4DF; font-weight:600;\">Head of Operations · Mitglied der Geschäftsleitung<\u002Fp>\n          <div style=\"margin-top:15px; display:grid; gap:4px; font-size:15px; color:#C6D9EA;\">\n            <span style=\"color:#9FB6CC; font-size:14px; margin-bottom:5px;\">ROWAPA AG · Rotkreuz<\u002Fspan>\n            <span>T +41 (0)41 632 66 11<\u002Fspan>\n            <span>M +41 (0)78 405 80 11<\u002Fspan>\n            <span><a href=\"mailto:boek@rowapa.ch\" style=\"color:#FFFFFF; border-bottom:1px solid rgba(255,255,255,.45);\" style-hover=\"color:#A0C4DF;\">boek@rowapa.ch<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:46px; border-top:1px solid rgba(255,255,255,.22);\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleDs }}\" style=\"width:100%; background:transparent; border:0; font:inherit; cursor:pointer; padding-block:17px; color:#A0C4DF; font-size:15px; font-weight:600; display:flex; align-items:center; gap:12px; text-align:left;\">\n        <span style=\"display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border:1px solid currentColor; font-size:14px; font-weight:700; flex:none;\">{{ dsZeichen }}<\u002Fspan>Hinweise zu Datenschutz und Aussagekraft\n      <\u002Fbutton>\n      <div style=\"display:{{ dsAnzeige }}; padding-bottom:14px; max-width:86ch;\">\n        <p style=\"font-size:14px; color:#B8CDE0;\">Der Umgang mit Personendaten, Zugriffsrechte, Vertraulichkeit, Aufbewahrung und Löschung werden vor der Erhebung vereinbart. Ergebnisse kleiner Gruppen werden geschützt. Interviews liefern qualitative Hinweise; quantitative Aussagen werden nur im Rahmen ihrer Belastbarkeit getroffen.<\u002Fp>\n        <p style=\"margin-top:10px; font-size:14px; color:#B8CDE0;\">Die Standortbestimmung zeigt Kompetenzen und beobachtetes Verhalten. Eine Veränderung geschäftlicher Leistungskennzahlen oder die Ursache eines Ergebnisses wird dadurch nicht automatisch nachgewiesen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:40px; padding-top:18px; border-top:1px solid rgba(255,255,255,.16); display:flex; flex-wrap:wrap; gap:8px 26px; justify-content:space-between; font-size:13.5px; color:#9FB6CC;\">\n      <span>ROWAPA AG · Suurstoffi 37 · CH-6343 Rotkreuz<\u002Fspan>\n      <span>Alle gezeigten Werte und Fallbeispiele sind illustrativ.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;anrede&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;du&quot;,&quot;sie&quot;],&quot;default&quot;:&quot;du&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ansprache&quot;},&quot;kundeName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Personalisierung&quot;},&quot;kundeRolle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Personalisierung&quot;}}\">\nconst ACH = ['Bedarfsergründung', 'Beratungsqualität', 'Kundenpotenziale', 'Verbindlichkeit'];\nconst TEAMS = [\n  { n: 'Team A', w: [7.8, 7.5, 7.2, 7.4] },\n  { n: 'Team B', w: [7.2, 7.1, 6.8, 7.0] },\n  { n: 'Team C', w: [6.9, 7.3, 6.4, 6.8] },\n  { n: 'Team D', w: [5.8, 6.6, 5.3, 6.2] }\n];\nconst GRUPPEN = ['Bedarfs-\\nergründung', 'Beratungs-\\nqualität', 'Kunden-\\npotenziale', 'Verbind-\\nlichkeit'];\nconst GWERTE = [[7.8, 7.5, 7.2, 7.4], [7.2, 7.1, 6.8, 7.0], [6.9, 7.3, 6.4, 6.8], [5.8, 6.6, 5.3, 6.2]];\nconst GFARBEN = ['#A0C4DF', '#7FA3CB', '#486EA3', '#AA1351'];\nconst PAARE = [\n  { name: 'Mitarbeitende coachen', e: 8.1, f: 5.5 },\n  { name: 'Feedback geben', e: 7.4, f: 6.2 },\n  { name: 'Verbindlichkeit fördern', e: 7.8, f: 5.9 },\n  { name: 'Meetings führen', e: 7.3, f: 7.0 }\n];\nconst REGLER = [\n  { key: 't', titel: 'Themen und Ziele', optionen: ['Ein Fokusthema', 'Zwei Leistungsfelder', 'Breite Standortbestimmung'] },\n  { key: 'p', titel: 'Personen und Einheiten', optionen: ['Ein Team', 'Mehrere Teams', 'Ganze Einheit'] },\n  { key: 'v', titel: 'Erhebungstiefe', optionen: ['Kompakt', 'Ausgewogen', 'Vertieft'] }\n];\nconst VERBEN = {\n  'anfängst':'anfangen','arbeitest':'arbeiten','beginnst':'beginnen','begleitest':'begleiten',\n  'bekommst':'bekommen','bestimmst':'bestimmen','behältst':'behalten','bist':'sind',\n  'brauchst':'brauchen','definierst':'definieren','entscheidest':'entscheiden',\n  'erhältst':'erhalten','erkennst':'erkennen','erfährst':'erfahren','findest':'finden',\n  'folgst':'folgen','führst':'führen','gehst':'gehen','gibst':'geben','hast':'haben',\n  'hältst':'halten','investierst':'investieren','kannst':'können','kennst':'kennen',\n  'kommst':'kommen','legst':'legen','liest':'lesen','lieferst':'liefern','lässt':'lassen',\n  'machst':'machen','musst':'müssen','möchtest':'möchten','nennst':'nennen','nimmst':'nehmen',\n  'planst':'planen','prüfst':'prüfen','sagst':'sagen','schulst':'schulen','siehst':'sehen',\n  'solltest':'sollten','stehst':'stehen','tust':'tun','vermutest':'vermuten',\n  'verschickst':'verschicken','weisst':'wissen','willst':'wollen','wirst':'werden',\n  'wählst':'wählen','würdest':'würden','zeigst':'zeigen'\n};\nconst PRONOMEN = [\n  [/\\bDeinem\\b/g,'Ihrem'], [/\\bDeinen\\b/g,'Ihren'], [/\\bDeiner\\b/g,'Ihrer'],\n  [/\\bDeines\\b/g,'Ihres'], [/\\bDeine\\b/g,'Ihre'],   [/\\bDein\\b/g,'Ihr'],\n  [/\\bDir\\b/g,'Ihnen'],    [/\\bDich\\b/g,'Sie'],     [/\\bDu\\b/g,'Sie']\n];\nconst VERBMUSTER = new RegExp('\\\\b(' + Object.keys(VERBEN).sort((a, b) => b.length - a.length).join('|') + ')\\\\b', 'g');\n\nclass Component extends DCLogic {\n  state = { anrede: null, team: 3, umfang: { t: 0, p: 1, v: 1 }, erk: false, ds: false };\n  original = new WeakMap();\n\n  get anrede() { return this.state.anrede || this.props.anrede || 'du'; }\n\n  componentDidMount() { this.umschreiben(); this.anwenden(); }\n  componentDidUpdate() { this.umschreiben(); this.anwenden(); }\n\n  anwenden() {\n    const w = this.dcRoot || document;\n    const s = this.state;\n    const t = TEAMS[s.team];\n    for (let i = 0; i < 4; i++) {\n      const zeile = w.querySelector('#einblick [data-i=\"' + i + '\"]');\n      if (zeile) zeile.style.outline = i === s.team ? '2px solid #486EA3' : '0px solid transparent';\n      const mk = w.querySelector('[data-mark=\"' + i + '\"]');\n      if (mk) mk.style.background = i === s.team ? '#486EA3' : 'transparent';\n      const lb = w.querySelector('[data-label=\"' + i + '\"]');\n      if (lb) lb.style.fontWeight = i === s.team ? '700' : '600';\n      const bar = w.querySelector('[data-bar=\"' + i + '\"]');\n      const bw = w.querySelector('[data-bw=\"' + i + '\"]');\n      if (bar) {\n        const v = t.w[i];\n        const farbe = v < 6 ? '#AA1351' : '#486EA3';\n        bar.style.width = (v / 10 * 100).toFixed(1) + '%';\n        bar.style.background = farbe;\n        if (bw) bw.style.color = farbe;\n      }\n    }\n    REGLER.forEach(r => {\n      const grp = w.querySelector('[data-k=\"' + r.key + '\"]');\n      if (!grp) return;\n      [...grp.querySelectorAll('button[data-i]')].forEach(b => {\n        const an = s.umfang[r.key] === Number(b.dataset.i);\n        b.style.borderColor = an ? '#A0C4DF' : 'rgba(255,255,255,.22)';\n        b.style.background = an ? 'rgba(160,196,223,.22)' : 'transparent';\n        b.style.color = an ? '#FFFFFF' : '#B8CDE0';\n      });\n    });\n    const band = w.querySelector('[data-band]');\n    if (band) band.style.width = (18 + (s.umfang.t + s.umfang.p + s.umfang.v) * 13.5).toFixed(0) + '%';\n  }\n\n  nachSie(text) {\n    const teile = text.split(/([.;:!?]+\\s*)/);\n    for (let i = 0; i < teile.length; i++) {\n      if (/\\bDu\\b/.test(teile[i])) teile[i] = teile[i].replace(VERBMUSTER, t => VERBEN[t] || t);\n    }\n    let out = teile.join('');\n    PRONOMEN.forEach(p => { out = out.replace(p[0], p[1]); });\n    return out;\n  }\n\n  umschreiben() {\n    const wurzel = this.dcRoot || document.body;\n    const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {\n      acceptNode: n => {\n        const p = n.parentNode && n.parentNode.nodeName;\n        if (p === 'SCRIPT' || p === 'STYLE' || p === 'BUTTON') return NodeFilter.FILTER_REJECT;\n        return /\\S/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;\n      }\n    });\n    const sie = this.anrede === 'sie';\n    let n;\n    while ((n = lauf.nextNode())) {\n      let c = this.original.get(n);\n      if (!c || (n.nodeValue !== c.src && n.nodeValue !== c.out)) {\n        c = { src: n.nodeValue, out: this.nachSie(n.nodeValue) };\n        this.original.set(n, c);\n      }\n      const ziel = sie ? c.out : c.src;\n      if (n.nodeValue !== ziel) n.nodeValue = ziel;\n    }\n  }\n\n  deck(v) {\n    const a = Math.max(0, Math.min(1, (v - 4.2) / 4.4));\n    return { o: 0.12 + a * 0.76, hell: a > 0.52 };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const aktiv = this.anrede;\n\n    const heatRows = TEAMS.map((t, i) => ({\n      name: t.n,\n      i: String(i),\n      ring: i === s.team ? '2px solid #486EA3' : '0px solid transparent',\n      gewicht: i === s.team ? 700 : 600,\n      marke: i === s.team ? '#486EA3' : 'transparent',\n      cells: t.w.map((v, j) => {\n        const d = this.deck(v);\n        return {\n          v: v.toFixed(1),\n          bg: 'rgba(72,110,163,' + d.o.toFixed(2) + ')',\n          fg: d.hell ? '#FFFFFF' : '#1D3149',\n          ring: (i === 3 && j === 2) ? 'inset 0 0 0 2px #AA1351' : 'none',\n          delay: ((i * 4 + j) * 0.04).toFixed(2) + 's'\n        };\n      })\n    }));\n\n    const t = TEAMS[s.team];\n    const schnitt = t.w.reduce((a, b) => a + b, 0) / t.w.length;\n    let minI = 0, maxI = 0;\n    t.w.forEach((v, i) => { if (v < t.w[minI]) minI = i; if (v > t.w[maxI]) maxI = i; });\n    const detail = {\n      name: t.n,\n      schnitt: schnitt.toFixed(1),\n      lage: schnitt >= 6.8 ? 'über dem Mittel' : 'unter dem Mittel',\n      b0: { label: ACH[0], v: t.w[0].toFixed(1) },\n      b1: { label: ACH[1], v: t.w[1].toFixed(1) },\n      b2: { label: ACH[2], v: t.w[2].toFixed(1) },\n      b3: { label: ACH[3], v: t.w[3].toFixed(1) },\n      hinweis: 'Stärkste Ausprägung: ' + ACH[maxI] + '. Tiefster Wert: ' + ACH[minI] + '.'\n    };\n\n    const gruppen = GRUPPEN.map((g, j) => ({\n      titel: g,\n      saeulen: GWERTE.map((reihe, i) => ({\n        v: reihe[j].toFixed(1),\n        h: (reihe[j] / 10 * 100).toFixed(1) + '%',\n        farbe: GFARBEN[i],\n        delay: ((j * 4 + i) * 0.045).toFixed(2) + 's'\n      }))\n    }));\n\n    const paare = PAARE.map(p => {\n      const lo = Math.min(p.e, p.f), hi = Math.max(p.e, p.f);\n      const d = p.e - p.f;\n      return {\n        name: p.name, e: p.e.toFixed(1), f: p.f.toFixed(1),\n        delta: (d > 0 ? '+' : '') + d.toFixed(1),\n        deltaFarbe: Math.abs(d) >= 1.5 ? '#AA1351' : '#9AA7B4',\n        links: (lo / 10 * 100).toFixed(1) + '%',\n        breite: ((hi - lo) / 10 * 100).toFixed(1) + '%',\n        ePos: (p.e / 10 * 100).toFixed(1) + '%',\n        fPos: (p.f / 10 * 100).toFixed(1) + '%'\n      };\n    });\n\n    const summe = s.umfang.t + s.umfang.p + s.umfang.v;\n    const umfangLabel = summe <= 1 ? 'Kompakter Rahmen' : (summe <= 4 ? 'Fokussierter Rahmen' : 'Umfassender Rahmen');\n    const umfangText = summe <= 1\n      ? 'Ein klar umrissener Einstieg: wenige Kompetenzfelder, eine Einheit, verdichtete Erhebung.'\n      : (summe <= 4\n        ? 'Ausgewogener Zuschnitt: mehrere Perspektiven, ohne die Organisation zu überlasten.'\n        : 'Breite Erhebung über mehrere Einheiten mit vertiefter Beobachtung im Arbeitsalltag.');\n\n    const mail = 'mailto:boek@rowapa.ch?subject=' + encodeURIComponent('ROWAPA Standortbestimmung — Folgegespräch')\n      + '&body=' + encodeURIComponent('Guten Tag\\n\\nich interessiere mich für die ROWAPA Standortbestimmung und würde das gerne persönlich besprechen.\\n\\nMeine Fragestellung:\\nMögliche Termine:\\n\\nFreundliche Grüsse\\n');\n\n    const kunde = (this.props.kundeName || '').trim();\n    const rolle = (this.props.kundeRolle || '').trim();\n\n    return {\n      zellen0: heatRows[0].cells, zellen1: heatRows[1].cells,\n      zellen2: heatRows[2].cells, zellen3: heatRows[3].cells,\n      detail, gruppen, paare, umfangLabel, umfangText,\n      mailLink: mail,\n      waehleZeile: (e) => {\n        const z = e.target.closest('[data-i]');\n        if (z) this.setState({ team: Number(z.dataset.i) });\n      },\n      waehleOption: (e) => {\n        const b = e.target.closest('button[data-i]');\n        const g = b && b.closest('[data-k]');\n        if (!b || !g) return;\n        const k = g.dataset.k;\n        this.setState(st => ({ umfang: Object.assign({}, st.umfang, { [k]: Number(b.dataset.i) }) }));\n      },\n      hatKunde: !!kunde,\n      kundeZeile: rolle ? kunde + ' · ' + rolle : kunde,\n      setzeDu: () => this.setState({ anrede: 'du' }),\n      setzeSie: () => this.setState({ anrede: 'sie' }),\n      duBg: aktiv === 'du' ? '#A0C4DF' : 'transparent',\n      duFg: aktiv === 'du' ? '#1D3149' : '#A0C4DF',\n      sieBg: aktiv === 'sie' ? '#A0C4DF' : 'transparent',\n      sieFg: aktiv === 'sie' ? '#1D3149' : '#A0C4DF',\n      toggleErk: () => this.setState({ erk: !s.erk }),\n      erkZeichen: s.erk ? '–' : '+',\n      erkAnzeige: s.erk ? 'grid' : 'none',\n      toggleDs: () => this.setState({ ds: !s.ds }),\n      dsZeichen: s.ds ? '–' : '+',\n      dsAnzeige: s.ds ? 'block' : 'none'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
